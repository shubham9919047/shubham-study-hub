            {type:'MC', q:'Condition for constructive interference:', opt:['A) Path diff = nλ', 'B) Phase diff = 2nπ', 'C) Path diff = (2n+1)λ/2', 'D) Bright fringe'], ans:['A','B','D'], sol:'C is for destructive'}

    },
    "Modern Physics": {
        desc: "Photoelectric, Bohr Model, X-rays, Nuclear Physics, Radioactivity",
        totalQ: 4,
        questions: [
            {type:'SC', q:'Photoelectric effect proves:', opt:['A) Wave nature', 'B) Particle nature of light', 'C) Both', 'D) Neither'], ans:'B', sol:'Einstein explained using photons'},
            {type:'NV', q:'Hydrogen atom: E₁=-13.6eV. E₂ = ___ eV', ans:'-3.4', sol:'$E_n = -13.6/n^2$ → E₂=-13.6/4=-3.4'},
            {type:'MC', q:'Nuclear force:', opt:['A) Strongest force', 'B) Short range', 'C) Charge independent', 'D) Attractive always'], ans:['A','B','C','D'], sol:'All properties true'},
            {type:'NV', q:'Half life 10 days. 75% decay in ___ days', ans:'20', sol:'75% decay → 25% left → 2 half lives = 20 days'}

    "Semiconductors": {
        desc: "Intrinsic/Extrinsic, PN Junction, Diode, Transistor, Logic Gates",
        totalQ: 3,
        questions: [
            {type:'SC', q:'PN junction forward biased:', opt:['A) Depletion layer increases', 'B) Depletion layer decreases', 'C) No current', 'D) Breakdown occurs'], ans:'B', sol:'Forward bias reduces barrier, depletion layer decreases'},
            {type:'MC', q:'Zener diode used as:', opt:['A) Rectifier', 'B) Voltage
     
        ]

let currentChapter = '', currentQ = 0, userAns = {};

function loadChapters() {
    let html = '';
    for(let chap in physicsData) {
        const data = physicsData[chap];
        html += `
        <div class="chapter-card" onclick="openChapter('${chap}')">
            <h3>${chap}</h3>
            <p>${data.desc}</p>
            <div class="stats">
                <span>${data.totalQ} Questions</span>
                <span class="badge">JEE PYQ</span>
            </div>
        </div>`;
    }
    document.getElementById('chapterList').innerHTML = html;
}

function searchChapter(val) {
    val = val.toLowerCase();
    document.querySelectorAll('.chapter-card').forEach(card => {
        const text = card.textContent.toLowerCase();
        card.style.display = text.includes(val)? 'block' : 'none';
    });
}

function openChapter(chap) {
    currentChapter = chap;
    currentQ = 0;
    userAns = {};
    document.getElementById('chapterList').style.display = 'none';
    document.getElementById('quizContainer').style.display = 'block';
    document.getElementById('chapterTitle').textContent = chap;
    showQ();
}

function closeQuiz() {
    document.getElementById('quizContainer').style.display = 'none';
    document.getElementById('chapterList').style.display = 'grid';
    userAns = {};
}

function showQ() {
    const q = physicsData[currentChapter].questions[currentQ];
    const totalQ = physicsData[currentChapter].questions.length;
    document.getElementById('qProgress').textContent = `Question ${currentQ+1} of ${totalQ}`;
    
    let html = `<div class="q-box"><b>Q${currentQ+1}.</b> ${q.q}<br><br>`;
    
    if(q.type == 'NV') {
        html += `Enter Answer: <input type="text" class="num-input" id="ans" value="${userAns[currentQ]||''}" placeholder="Numerical Value">`;
    } else {
        html += '<div class="options">';
        q.opt.forEach((opt,i) => {
            const val = String.fromCharCode(65+i);
            const checked = userAns[currentQ]?.includes(val)? 'checked' : '';
            const type = q.type=='SC'? 'radio' : 'checkbox';
            html += `<label><input type="${type}" name="q" value="${val}" ${checked} onchange="saveAns('${val}','${q.type}')"> ${opt}</label>`;
        });
        html += '</div>';
    }
    html += `</div><div class="solution" id="sol"><b>Solution:</b> ${q.sol}</div>`;
    document.getElementById('questionArea').innerHTML = html;
    if(window.MathJax) MathJax.typesetPromise();
}

function saveAns(val, type) {
    if(type=='SC') userAns[currentQ] = [val];
    else {
        if(!userAns[currentQ]) userAns[currentQ] = [];
        if(userAns[currentQ].includes(val)) userAns[currentQ] = userAns[currentQ].filter(v=>v!=val);
        else userAns[currentQ].push(val);
    }
}

function checkAns() {
    const q = physicsData[currentChapter].questions[currentQ];
    let userVal = q.type=='NV'? document.getElementById('ans').value : userAns[currentQ];
    let correct = false;
    
    if(q.type=='SC') correct = userVal && userVal[0] == q.ans;
    else if(q.type=='MC') correct = userVal && userVal.sort().join() == q.ans.sort().join();
    else correct = Math.abs(parseFloat(userVal) - parseFloat(q.ans)) < 0.01;
    
    document.getElementById('sol').style.display = 'block';
    document.getElementById('sol').innerHTML = `<b class="${correct?'correct':'wrong'}">${correct?'✓ Correct!':'✗ Wrong!'}</b><br><br><b>Solution:</b> ${q.sol}`;
    if(window.MathJax) MathJax.typesetPromise();
}

function nextQ() {
    if(currentQ < physicsData[currentChapter].questions.length - 1) {
        currentQ++;
        showQ();
    } else {
        alert('Chapter Complete! 🎉 Click Close Chapter to go back.');
    }
}

function prevQ() {
    if(currentQ > 0) {
        currentQ--;
        showQ();
    }
}

loadChapters();
</script>
